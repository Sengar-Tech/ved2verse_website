<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verse2ved Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<header class="nav">
  <span class="logo">Verse<span>2</span>ved <small>Admin</small></span>
  <div class="row"><a href="index.html">View site</a><button class="btn btn-sm" id="logout" hidden>Log out</button></div>
</header>

<main class="wrap">
  <section id="login" hidden class="panel narrow">
    <h1>Admin login</h1>
    <form id="login-form">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" autocomplete="username" required>
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <p class="error" id="login-msg" role="alert"></p>
      <button class="btn" type="submit">Log in</button>
    </form>
  </section>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="media">Photos &amp; videos</button>
      <button role="tab" aria-selected="false" data-tab="inquiries">Inquiries <span class="badge" id="new-count" hidden></span></button>
      <button role="tab" aria-selected="false" data-tab="clients">Clients</button>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <!-- MEDIA -->
    <section id="tab-media" class="panel">
      <h2>Add content</h2>
      <div class="two">
        <form id="upload-form">
          <h3>Upload photo or video</h3>
          <label for="u-file">File (max 50 MB)</label>
          <input id="u-file" type="file" accept="image/*,video/*" required>
          <label for="u-title">Description</label>
          <input id="u-title" type="text" maxlength="200" placeholder="What is in the photo or video?">
          <label for="u-label">Tag (photos only)</label>
          <input id="u-label" type="text" maxlength="30" placeholder="Festive, Cool kid...">
          <button class="btn" type="submit">Upload</button>
        </form>
        <form id="link-form">
          <h3>Add Instagram or YouTube link</h3>
          <label for="k-url">Link</label>
          <input id="k-url" type="url" required placeholder="https://www.instagram.com/reel/...">
          <label for="k-title">Description</label>
          <input id="k-title" type="text" maxlength="200">
          <button class="btn" type="submit">Add link</button>
        </form>
      </div>
      <h2>Your content</h2>
      <ul id="media-list" class="list"></ul>
    </section>

    <!-- INQUIRIES -->
    <section id="tab-inquiries" class="panel" hidden>
      <h2>Brand inquiries</h2>
      <ul id="inq-list" class="list"></ul>
    </section>

    <!-- CLIENTS -->
    <section id="tab-clients" class="panel" hidden>
      <h2>Add client or brand</h2>
      <form id="client-form" class="grid-form">
        <div><label for="c-brand">Brand *</label><input id="c-brand" required maxlength="200"></div>
        <div><label for="c-contact">Contact person</label><input id="c-contact" maxlength="200"></div>
        <div><label for="c-email">Email</label><input id="c-email" type="email"></div>
        <div><label for="c-phone">Phone</label><input id="c-phone" type="tel"></div>
        <div><label for="c-deliv">Deliverable</label><input id="c-deliv" placeholder="2 reels + 1 story"></div>
        <div><label for="c-deadline">Deadline</label><input id="c-deadline" type="date"></div>
        <div><label for="c-value">Fee (₹)</label><input id="c-value" type="number" min="0" step="1"></div>
        <div class="full"><button class="btn" type="submit">Add client</button></div>
      </form>
      <h2>Pipeline</h2>
      <ul id="client-list" class="list"></ul>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
